<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello NTWB</title>
<link rel="stylesheet" href="hello.css">
</head>
<body>
<main>
  <h1>Hello NTWB</h1>
  <p class="status" id="status">connecting…</p>
  <section>
    <div class="count" id="count">–</div>
    <div class="row"><button id="minus">−1</button><button id="plus">+1</button></div>
    <p class="hint">The counter lives in the native app; every open page sees the same value.</p>
  </section>
  <section>
    <button id="pic">Get a picture</button>
    <img id="img" alt="">
  </section>
  <ul id="log"></ul>
</main>
<script src="/ntwb/ntwb.js"></script>
<script src="hello.js"></script>
</body>
</html>
