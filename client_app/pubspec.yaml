name: arstro_remote_client
description: "Arstro Remote Client - share this Android phone through your own Arstro device manager (docs/phone/PHONE.md)."
publish_to: 'none'

# versionName+versionCode of the APK (scripts/build_apk.sh --client names the file after it)
version: 2.0.0+4

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Geist and Geist Mono, the Arstro type (docs/design.md): SIL OFL 1.1, fonts/LICENSE.Geist.txt
  assets:
    - fonts/LICENSE.Geist.txt
  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
